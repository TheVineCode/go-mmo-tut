syntax = "proto3";

package packets;
option go_package = "pkg/packets";

//Custom Types (basically a struct)
message ChatMessage { string msg = 1; }
message IdMessage { uint64 id = 1; }

//A Packet is a message with a sender
message Packet {
    uint64 sender_id = 1;
    //oneof means it needs at least one of the types (I THINK)
    oneof msg {
        ChatMessage chat = 2;
        IdMessage id = 3;
    }
}
